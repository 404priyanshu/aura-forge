# StyLua formatting rules (https://github.com/JohnnyMorganz/StyLua).
# Format everything with `stylua src`; CI runs `stylua --check src`.
# Third-party code is excluded in .styluaignore.

syntax = "Luau"
column_width = 120
line_endings = "Unix"
indent_type = "Tabs"
indent_width = 4
quote_style = "AutoPreferDouble"
call_parentheses = "Always"
