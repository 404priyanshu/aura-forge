name: luau-lsp

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: luau-lsp-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with rokit.toml.
  ROJO_VERSION: 7.7.1
  LUAU_LSP_VERSION: 1.70.1
  SELENE_VERSION: 0.32.0
  STYLUA_VERSION: 2.6.0

jobs:
  analyze:
    name: Format, type check & lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Cache tools and type definitions
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/bin/rojo
            ~/.local/bin/luau-lsp
            ~/.local/bin/selene
            ~/.local/bin/stylua
            .cache
          key: luau-tools-${{ runner.os }}-rojo${{ env.ROJO_VERSION }}-lsp${{ env.LUAU_LSP_VERSION }}-selene${{ env.SELENE_VERSION }}-stylua${{ env.STYLUA_VERSION }}

      - name: Install Rojo, luau-lsp, selene and StyLua
        run: |
          mkdir -p ~/.local/bin
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          cd "$RUNNER_TEMP"
          if [[ ! -x ~/.local/bin/rojo ]]; then
            curl -fsSL -o rojo.zip "https://github.com/rojo-rbx/rojo/releases/download/v${ROJO_VERSION}/rojo-${ROJO_VERSION}-linux-x86_64.zip"
            unzip -o -q rojo.zip -d rojo && install rojo/rojo ~/.local/bin/rojo
          fi
          if [[ ! -x ~/.local/bin/luau-lsp ]]; then
            curl -fsSL -o luau-lsp.zip "https://github.com/JohnnyMorganz/luau-lsp/releases/download/${LUAU_LSP_VERSION}/luau-lsp-linux-x86_64.zip"
            unzip -o -q luau-lsp.zip -d luau-lsp && install luau-lsp/luau-lsp ~/.local/bin/luau-lsp
          fi
          if [[ ! -x ~/.local/bin/selene ]]; then
            # Full build (not "selene-light"): it can generate the Roblox standard library.
            curl -fsSL -o selene.zip "https://github.com/Kampfkarren/selene/releases/download/${SELENE_VERSION}/selene-${SELENE_VERSION}-linux.zip"
            unzip -o -q selene.zip -d selene && install selene/selene ~/.local/bin/selene
          fi
          if [[ ! -x ~/.local/bin/stylua ]]; then
            curl -fsSL -o stylua.zip "https://github.com/JohnnyMorganz/StyLua/releases/download/v${STYLUA_VERSION}/stylua-linux-x86_64.zip"
            unzip -o -q stylua.zip -d stylua && install stylua/stylua ~/.local/bin/stylua
          fi

      # The check steps below all run even if an earlier one fails, so one run reports everything.
      - name: Check formatting (StyLua)
        # Rules: stylua.toml. Fix locally with `stylua src`.
        run: stylua --check src

      - name: Run luau-lsp analyze
        if: ${{ !cancelled() }}
        run: ./scripts/analyze.sh

      - name: Lint (selene)
        # Fails on warnings as well as errors. Rules: selene.toml.
        if: ${{ !cancelled() }}
        run: selene src
